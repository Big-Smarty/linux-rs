[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.101"
publish = false

[[bin]]
name = "linux-rs-kernel"
path = "src/main.rs"
test = false
bench = false
required-features = ["freestanding"]

[features]
default = []
freestanding = []
qemu-self-test = ["freestanding"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
raw-cpuid = "=11.6.0"
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"] }
