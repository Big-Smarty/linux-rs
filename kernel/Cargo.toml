[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.101"
publish = false

[[bin]]
name = "linux-rs-kernel"
path = "src/main.rs"
test = false
bench = false
required-features = ["freestanding"]

[features]
default = []
freestanding = ["dep:x86_64", "dep:raw-cpuid", "dep:linux-rs-runtime", "dep:font8x8"]
# Proofs that run at boot on any machine: no port or MMIO access beyond what the
# kernel itself needs. `qemu-self-test` adds the QEMU-only COM1 and debug-exit
# I/O; `baremetal-suite` adds the user-run hardware suite (decision A21) and
# stays free of both (docs/bare-metal-suite.md, "Kernel-run suite").
boot-proofs = []
qemu-self-test = ["freestanding", "boot-proofs", "linux-rs-runtime?/self-test"]
baremetal-suite = ["freestanding", "boot-proofs", "linux-rs-runtime?/self-test"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
syscalls = { version = "=0.8.1", default-features = false, features = ["x86_64"] }
raw-cpuid = { version = "=11.6.0", optional = true }
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"], optional = true }
linux-rs-runtime = { version = "0.1.0", path = "../rt", optional = true }
font8x8 = { version = "=0.3.1", default-features = false, optional = true }
buddy_system_allocator = { version = "=0.13.0", default-features = false }
