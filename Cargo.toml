[workspace]
members = ["xtask", "baremetal", "kernel", "user/init"]
default-members = ["xtask", "baremetal"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 2
overflow-checks = true
